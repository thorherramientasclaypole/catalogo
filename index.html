<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thor Herramientas – Catálogo venta directa</title>
<meta name="description" content="Herramientas con precio de venta directa. Retiro en Claypole.">
<style>
:root{--y:#FFC400;--k:#111;--bg:#f4f3ef;--t:#1b1b1b;--mut:#666;--card:#fff;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--k);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;color:var(--y);font-size:22px;letter-spacing:1px;line-height:1}
.logo small{display:block;color:#fff;font-size:10px;letter-spacing:4px;font-weight:600;margin-top:2px}
.badge{background:var(--y);color:var(--k);font-weight:800;font-size:12px;padding:4px 8px;border-radius:6px}
input{flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:0;font-size:16px}
main{max-width:1100px;margin:16px auto;padding:0 16px}
.info{font-size:13px;color:var(--mut);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;padding:8px}
.noimg{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fafafa;color:#bbb;font-weight:800;font-size:28px}
.body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:14px;line-height:1.3;flex:1}
.price{font-size:22px;font-weight:900}
.price small{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.btns{display:flex;flex-direction:column;gap:6px}
.btn{flex:1;border:0;border-radius:8px;padding:10px 6px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;text-align:center}
.wa{background:var(--wa);color:#fff}
.sh{background:var(--k);color:var(--y);padding:8px 6px}
.msg{padding:40px 16px;text-align:center;color:var(--mut)}
footer{text-align:center;font-size:13px;color:var(--mut);padding:24px 16px;line-height:1.6}
</style>
</head>
<body>
<header><div class="top">
  <div class="logo">THOR<small>HERRAMIENTAS</small></div>
  <span class="badge">PRECIOS VENTA DIRECTA</span>
  <input id="q" placeholder="Buscar producto o marca…" autocomplete="off" type="search">
</div></header>
<main>
  <p class="info" id="info">Cargando productos…</p>
  <div class="grid" id="grid"></div>
</main>
<footer>📍 González 3741, Claypole · Lunes a sábado de 9 a 18 h<br>Precios de venta directa, sujetos a stock.</footer>

<script>
/* ===== CONFIGURACIÓN ===== */
// Link CSV de la pestaña "Catalogo" publicada en la web (Archivo > Compartir > Publicar en la web)
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQkqI94GWKbvi_TknDAv6pIGmFtaly_IIng9TlqUeA3U4d-h_8GXnMacXb0yizdyULSCoZ18dDl8Tpa/pub?gid=722531774&single=true&output=csv';
// Número de WhatsApp del negocio, solo dígitos con código de país (ej: 5491112345678). Vacío = sin botón "Pedir".
const WHATSAPP = '5491156465544';
/* ========================= */

const fmt = n => '$' + Number(n).toLocaleString('es-AR');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const grid = document.getElementById('grid'), info = document.getElementById('info');
let P = [];

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(q = ''){
  const t = norm(q);
  const list = P.filter(p => norm(p.n).includes(t));
  info.textContent = list.length + (list.length === 1 ? ' producto' : ' productos');
  grid.innerHTML = list.map(p => `<div class="card">
    ${p.img ? `<img loading="lazy" src="${esc(p.img)}" alt="${esc(p.n)}">` : '<div class="noimg">THOR</div>'}
    <div class="body">
      <div class="name">${esc(p.n)}</div>
      <div class="price"><small>Precio directo</small>${fmt(p.p)}</div>
      <div class="btns">
        ${WHATSAPP ? `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola! Me interesa: ' + p.n + ' (' + fmt(p.p) + ')')}">Pedir por WhatsApp</a>` : ''}
        <button class="btn ${WHATSAPP ? 'sh' : 'wa'}" data-i="${P.indexOf(p)}">${WHATSAPP ? 'Compartir' : 'Enviar por WhatsApp'}</button>
      </div>
    </div></div>`).join('');
}

async function share(p){
  const text = `*${p.n}*\n💲 ${fmt(p.p)} (precio directo)\n📍 Retiro en Claypole – González 3741\nThor Herramientas`;
  try {
    if (p.img && navigator.canShare){
      const blob = await (await fetch(p.img)).blob();
      const file = new File([blob], 'producto.' + (blob.type.split('/')[1] || 'jpg'), {type: blob.type});
      if (navigator.canShare({files:[file]})) { await navigator.share({files:[file], text}); return; }
    }
    if (navigator.share) { await navigator.share({text: text + (p.img ? '\n' + p.img : '')}); return; }
  } catch(e) { if (e.name === 'AbortError') return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

grid.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) share(P[+b.dataset.i]); });
document.getElementById('q').addEventListener('input', e => render(e.target.value));

fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => {
    P = parseCSV(t).slice(1)
      .map(r => ({n: (r[0]||'').trim(), p: parseInt(String(r[1]||'').trim().replace(/[.,]\d{1,2}$/, '').replace(/\D/g, ''), 10), img: (r[2]||'').trim()}))
      .filter(x => x.n && x.p > 0);
    render();
  })
  .catch(() => { info.textContent = ''; grid.innerHTML = '<p class="msg">No se pudo cargar el catálogo. Probá de nuevo en un rato.</p>'; });
</script>
</body>
</html>
